<section class="panel" id="projects" aria-labelledby="projects-title">
  <header class="panel__head panel__head--row">
    <h2
      class="panel__title"
      id="projects-title"
      x-text="projectsTitle"
    >Projects</h2>
    <p class="panel__sub" x-text="t.ui.projectsSubtitle"></p>
  </header>

  <div class="project-toolbar" role="search">
    <label class="project-search">
      <span class="visually-hidden" x-text="t.projects.searchPlaceholder"></span>
      <span
        class="project-search__icon"
        x-html="icons.magnifyingGlass"
        aria-hidden="true"
      ></span>
      <input
        class="project-search__input"
        type="search"
        name="project-query"
        autocomplete="off"
        spellcheck="false"
        :placeholder="t.projects.searchPlaceholder"
        :aria-label="t.projects.searchPlaceholder"
        x-model="projectQuery"
        @keydown.escape.prevent="clearProjectQuery()"
      />
      <button
        type="button"
        class="project-search__clear"
        x-show="projectQuery"
        x-cloak
        :aria-label="t.projects.clearFilters"
        @click="clearProjectQuery()"
      >
        <span x-html="icons.xMark" aria-hidden="true"></span>
      </button>
    </label>

    <div
      class="project-filters"
      :class="{
        'project-filters--open': projectFiltersOpen,
        'project-filters--active':
          projectGroupFilter !== 'all' || projectKindFilter !== 'all',
      }"
    >
      <button
        type="button"
        class="project-filters__toggle"
        :aria-expanded="projectFiltersOpen ? 'true' : 'false'"
        aria-controls="project-filters-panel"
        @click="toggleProjectFilters()"
      >
        <span class="project-filters__toggle-label" x-text="t.projects.filtersLabel"></span>
        <span
          class="project-filters__toggle-badge"
          x-show="projectGroupFilter !== 'all' || projectKindFilter !== 'all'"
          x-cloak
          aria-hidden="true"
        ></span>
        <span
          class="project-filters__toggle-chevron"
          aria-hidden="true"
          x-html="icons.chevronDown"
        ></span>
      </button>

      <div
        class="project-filters__collapse"
        :inert="!projectFiltersOpen"
      >
        <div class="project-filters__collapse-inner">
          <div
            id="project-filters-panel"
            class="project-filters__panel"
            role="region"
            :aria-label="t.projects.filtersLabel"
            :aria-hidden="projectFiltersOpen ? 'false' : 'true'"
          >
            <div class="project-filters__row">
              <span class="project-filters__label" x-text="t.projects.groupByLabel"></span>
              <div class="project-filters__chips" role="group">
                <template x-for="chip in projectGroupByChips" :key="'by-' + chip.id">
                  <button
                    type="button"
                    class="project-chip"
                    :class="{ 'project-chip--active': projectGroupBy === chip.id }"
                    :aria-pressed="projectGroupBy === chip.id ? 'true' : 'false'"
                    @click="setProjectGroupBy(chip.id)"
                  >
                    <span x-text="chip.label"></span>
                  </button>
                </template>
              </div>
            </div>

            <div class="project-filters__row">
              <span class="project-filters__label" x-text="t.projects.filterKinds"></span>
              <div class="project-filters__chips" role="group">
                <template x-for="chip in projectKindChips" :key="'k-' + chip.id">
                  <button
                    type="button"
                    class="project-chip"
                    :class="{ 'project-chip--active': projectKindFilter === chip.id }"
                    :aria-pressed="projectKindFilter === chip.id ? 'true' : 'false'"
                    @click="setProjectKindFilter(chip.id)"
                  >
                    <span x-text="chip.label"></span>
                    <span class="project-chip__count" x-text="chip.count"></span>
                  </button>
                </template>
              </div>
            </div>

            <div class="project-filters__row">
              <span class="project-filters__label" x-text="t.projects.filterGroups"></span>
              <div class="project-filters__chips" role="group">
                <template x-for="chip in projectGroupChips" :key="'g-' + chip.id">
                  <button
                    type="button"
                    class="project-chip"
                    :class="{ 'project-chip--active': projectGroupFilter === chip.id }"
                    :aria-pressed="projectGroupFilter === chip.id ? 'true' : 'false'"
                    @click="setProjectGroupFilter(chip.id)"
                  >
                    <span x-text="chip.label"></span>
                    <span class="project-chip__count" x-text="chip.count"></span>
                  </button>
                </template>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="project-toolbar__meta">
      <p
        class="project-toolbar__count"
        aria-live="polite"
        x-text="projectResultLabel"
      ></p>
      <button
        type="button"
        class="project-toolbar__clear"
        x-show="projectFiltersActive"
        x-cloak
        @click="clearProjectFilters()"
        x-text="t.projects.clearFilters"
      ></button>
    </div>
  </div>

  <div
    class="project-empty"
    x-show="projectResultCount === 0"
    x-cloak
  >
    <p class="project-empty__text" x-text="t.projects.empty"></p>
    <button
      type="button"
      class="project-empty__clear"
      x-show="projectFiltersActive"
      @click="clearProjectFilters()"
      x-text="t.projects.clearFilters"
    ></button>
  </div>

  <div class="project-library" x-show="projectResultCount > 0">
    <template x-for="section in projectSections" :key="section.id">
      <section
        class="project-group"
        :style="`--group-glow: ${section.markFill}`"
        :aria-labelledby="`project-group-${section.id}`"
      >
        <header class="project-group__head">
          <div
            class="project-group__mark"
            :class="{ 'project-group__mark--icon': section.markMode === 'icon' }"
            :style="`--mark-fill: ${section.markFill}`"
            aria-hidden="true"
          >
            <template x-if="section.markMode === 'icon'">
              <span class="project-group__icon" x-html="section.markHtml"></span>
            </template>
            <template x-if="section.markMode !== 'icon'">
              <svg viewBox="0 0 24 24" focusable="false">
                <path :d="section.mark.path" fill="currentColor"></path>
              </svg>
            </template>
          </div>
          <h3
            class="project-group__title"
            :id="`project-group-${section.id}`"
            x-text="section.title"
          ></h3>
          <span class="project-group__count" x-text="section.count"></span>
          <p
            class="project-group__desc"
            x-show="section.description"
            x-text="section.description"
          ></p>
        </header>

        <div class="project-list" role="list">
          <template x-for="project in section.projects" :key="project.id">
            <article
              class="proj"
              role="listitem"
              :class="{
                'proj--open': isProjectOpen(project.id),
                'proj--featured': project.featured,
              }"
              :style="`--mark-fill: ${project.mark.fill}`"
            >
              <button
                type="button"
                class="proj__head"
                :id="`proj-head-${project.id}`"
                :aria-expanded="isProjectOpen(project.id) ? 'true' : 'false'"
                :aria-controls="`proj-body-${project.id}`"
                :title="isProjectOpen(project.id) ? t.projects.hideDetails : t.projects.showDetails"
                @click="toggleProject(project.id)"
              >
                <svg class="proj__mark" viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                  <path :d="project.mark.path" fill="currentColor"></path>
                </svg>
                <span class="proj__title" x-text="project.title"></span>
                <span
                  class="proj__star"
                  x-show="project.featured"
                  :title="t.projects.featured"
                  :aria-label="t.projects.featured"
                  role="img"
                  x-text="'★'"
                ></span>
                <span
                  class="proj__meta"
                  x-text="projectGroupBy === 'shelf' ? project.kindLabel : project.tags[0]"
                ></span>
                <span
                  class="proj__chevron"
                  aria-hidden="true"
                  x-html="icons.chevronDown"
                ></span>
              </button>

              <div class="proj__collapse" :inert="!isProjectOpen(project.id)">
                <div class="proj__collapse-inner">
                  <div
                    class="proj__body"
                    :id="`proj-body-${project.id}`"
                    role="region"
                    :aria-labelledby="`proj-head-${project.id}`"
                  >
                    <p class="proj__blurb" x-text="project.blurb"></p>
                    <ul class="proj__highlights" x-show="project.highlights.length">
                      <template x-for="(item, hi) in project.highlights" :key="hi">
                        <li x-text="item"></li>
                      </template>
                    </ul>
                    <div class="proj__foot">
                      <ul class="proj__tags">
                        <template x-for="tag in project.tags" :key="tag">
                          <li>
                            <button
                              type="button"
                              class="proj__tag"
                              @click="onProjectTagClick(tag)"
                              x-text="tag"
                            ></button>
                          </li>
                        </template>
                      </ul>
                      <a
                        class="proj__link"
                        :href="project.url"
                        rel="noopener noreferrer"
                        target="_blank"
                      >
                        <span x-text="t.projects.openCta"></span>
                        <span
                          class="proj__link-icon"
                          x-html="icons.arrowTopRightOnSquare"
                          aria-hidden="true"
                        ></span>
                      </a>
                    </div>
                  </div>
                </div>
              </div>
            </article>
          </template>
        </div>
      </section>
    </template>
  </div>

  <p class="project-notice" x-text="t.projects.notice"></p>
</section>
